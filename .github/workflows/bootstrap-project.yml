name: Bootstrap KnowledgeOps project

on:
  push:
    branches: ["feat/knowledgeops-end-to-end"]
    paths:
      - ".github/workflows/bootstrap-project.yml"
      - "bootstrap/**"

permissions:
  contents: write

jobs:
  expand-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/knowledgeops-end-to-end
          fetch-depth: 0
      - name: Reconstruct project payload
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/knowledgeops_payload.part* > /tmp/knowledgeops_payload.b64
          base64 --decode /tmp/knowledgeops_payload.b64 > /tmp/knowledgeops_payload.tar.gz
          echo "deab0f0ded9c5bc20bcee0fa7c2e55cbf9057085fd063d40edadcabab4b7de64  /tmp/knowledgeops_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/knowledgeops_payload.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-project.yml
      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build KnowledgeOps AI end-to-end platform"
          git push origin HEAD:feat/knowledgeops-end-to-end
